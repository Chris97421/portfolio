<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-label="Illustration d'un terminal avec des commandes Python et Git" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1100" height="620" fill="#0b1426"/>
<rect x="120" y="90" width="860" height="440" rx="20" fill="#13213b" stroke="#2ee59d" stroke-width="3"/>
<path d="M120,110 a20,20 0 0 1 20,-20 h820 a20,20 0 0 1 20,20 v40 h-860z" fill="#1c2f52"/>
<circle cx="165" cy="120" r="10" fill="#ff5f56"/><circle cx="200" cy="120" r="10" fill="#ffbd2e"/><circle cx="235" cy="120" r="10" fill="#27c93f"/>
<g font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="30">
<text x="160" y="215" fill="#2ee59d">$ python3 exercice.py</text>
<text x="160" y="270" fill="#e6edf5">Bonjour, Epitech !</text>
<text x="160" y="345" fill="#2ee59d">$ git add . &amp;&amp; git commit</text>
<text x="160" y="400" fill="#e6edf5">1 file changed</text>
<text x="160" y="475" fill="#2ee59d">$ _</text>
</g>
</svg>
